# ============================================================
#  coralrafayel.cn — 祁煜网页端（ai-love web）反向代理
#  放到 /etc/nginx/sites-available/coralrafayel.conf
# ============================================================
#
# ⚠ 为什么监听 8443 而不是 443：
#   服务器在腾讯云广州（境内），而 coralrafayel.cn **未备案**
#   ⇒ 80 / 443 会被腾讯云的备案拦截挡住（访问会跳到「网站未备案」提示页）。
#   **非标端口不受该拦截影响**，所以先用 8443 把 HTTPS 跑起来。
#   ⭐ 备案通过之后：把下面两处 8443 改成 443，reload 即可，别的一行都不用动。
#
# ⚠ 证书：Let's Encrypt 正式证书。签发走 acme.sh + DNS-01 验证
#   （腾讯云 DNSPod 子账号 me-dns 的密钥），再用 `--install-cert` 落到下面
#   这两个路径。续期由 acme.sh 自带的 cron job 负责，renew 后自动
#   `systemctl reload nginx`，所以这两个路径定下来就不用再手动动了。
#
# ⚠ 反代之后后端看到的是 127.0.0.1：web/app.py 按 IP 做登录限流
#   （`_login_blocked`），所以 **Nginx 必须把真实 IP 传下去**，
#   而 uvicorn 默认 `proxy_headers=True` + 只信任本机来的 X-Forwarded-For
#   ⇒ 下面三行 proxy_set_header 一个都不能少，否则所有用户会被当成同一个 IP，
#   一个人密码输错 5 次，全部人被锁 10 分钟。

server {
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    server_name coralrafayel.cn www.coralrafayel.cn;

    ssl_certificate     /etc/nginx/ssl/coralrafayel.crt;
    ssl_certificate_key /etc/nginx/ssl/coralrafayel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # 网页端允许传 2MB 头像，这里留点余量（Nginx 默认 1m，会先于后端拦住）
    client_max_body_size 4m;

    access_log /var/log/nginx/coralrafayel.access.log;
    error_log  /var/log/nginx/coralrafayel.error.log;

    # ============================================================
    #  🛡 /admin：管理员后台的**第一道墙**（2026-10-04「加固后台」那一批）
    # ============================================================
    # ⚠ 应用里已经有后台自己的登录页 + 独立 cookie 了，为什么还要在 nginx 拦一层：
    #   后台是**公网可达**的 ⇒ 多一层 IP 白名单，扫描器与陌生人**连登录页都看不到**，
    #   少掉一整类「拿密码字典打 /admin/login」的噪音。**两层都要留着**（纵深防御）。
    #
    # ⚠⚠ 动这一块之前先读三条：
    #   ① `allow 127.0.0.1` / `::1` **永远留着** —— 那是你的**后路**：
    #      `ssh -L 8081:127.0.0.1:8081 <服务器>` 之后开 `http://127.0.0.1:8081/admin`
    #      就能进，**不需要**白名单里有你的 IP。
    #   ② ✅ **2026-10-05 已换成真实出口 IP 段**：`allow 121.11.0.0/16;`（家里电信宽带是
    #      **动态 IP** ⇒ 按 /16 整段放行，而不是写死单个 IP）。
    #      ⚠ 以后**搬家 / 换宽带运营商**要回来改这一行 —— 出口 IP 换了段就会被挡在门外，
    #      那时候要么改成新段，要么删掉这行、老老实实走 ① 那条隧道（隧道永远通）。
    #      ⚠ 别写单个 IP：动态 IP 变了就进不去，且没法从外面自查。
    #   ③ 改完**先 `nginx -t`** 再 reload。被拒的访客看到 **403**（nginx 默认）；
    #      想更"隐身"（看起来像没这个路径）是另一个决定 —— ⚠ **别为此在这里用 `if`**，
    #      nginx 的 `if` 在 location 里是著名的坑。
    #
    # ⚠ `location /admin` 比 `location /` 更具体 ⇒ nginx 按**最长前缀**匹配，会走这一块。
    location /admin {
        allow 127.0.0.1;
        allow ::1;
        allow 121.11.0.0/16;    # 家里电信宽带（动态 IP ⇒ 按段放行）
        deny  all;

        # 🗄 后台的访问**单独记一个日志**：出问题一眼看得出是谁在打它
        access_log /var/log/nginx/coralrafayel.admin.log;
        # 搜索引擎别收录（应用侧也发了同一个头，这里是第二道）
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        proxy_pass http://127.0.0.1:8081;

        # ⚠⚠ 这四行**必须重写一遍**：`proxy_set_header` **不跨 location 继承**
        #    （漏了 X-Forwarded-For ⇒ 后台登录限流会把所有人当成同一个 IP；
        #      漏了 X-Forwarded-Proto ⇒ 后台 cookie 的 `secure` 判据失效）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后台不传文件（主 location 的 4m 是给头像留的）⇒ 这里收小
        client_max_body_size 1m;
        # 后台动作不调大模型 ⇒ 不用 180s
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话接口要等大模型，别 60 秒就掐断
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
