# ============================================================
#  coralrafayel.cn — 祁煜网页端（ai-love web）反向代理
#  放到 /etc/nginx/sites-available/coralrafayel.conf
# ============================================================
#
# ⚠ 为什么监听 8443 而不是 443：
#   服务器在腾讯云广州（境内），而 coralrafayel.cn **未备案**
#   ⇒ 80 / 443 会被腾讯云的备案拦截挡住（访问会跳到「网站未备案」提示页）。
#   **非标端口不受该拦截影响**，所以先用 8443 把 HTTPS 跑起来。
#   ⭐ 备案通过之后：把下面两处 8443 改成 443，reload 即可，别的一行都不用动。
#
# ⚠ 证书：Let's Encrypt 正式证书。签发走 acme.sh + DNS-01 验证
#   （腾讯云 DNSPod 子账号 me-dns 的密钥），再用 `--install-cert` 落到下面
#   这两个路径。续期由 acme.sh 自带的 cron job 负责，renew 后自动
#   `systemctl reload nginx`，所以这两个路径定下来就不用再手动动了。
#
# ⚠ 反代之后后端看到的是 127.0.0.1：web/app.py 按 IP 做登录限流
#   （`_login_blocked`），所以 **Nginx 必须把真实 IP 传下去**，
#   而 uvicorn 默认 `proxy_headers=True` + 只信任本机来的 X-Forwarded-For
#   ⇒ 下面三行 proxy_set_header 一个都不能少，否则所有用户会被当成同一个 IP，
#   一个人密码输错 5 次，全部人被锁 10 分钟。

server {
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    server_name coralrafayel.cn www.coralrafayel.cn;

    ssl_certificate     /etc/nginx/ssl/coralrafayel.crt;
    ssl_certificate_key /etc/nginx/ssl/coralrafayel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # 网页端允许传 2MB 头像，这里留点余量（Nginx 默认 1m，会先于后端拦住）
    client_max_body_size 4m;

    access_log /var/log/nginx/coralrafayel.access.log;
    error_log  /var/log/nginx/coralrafayel.error.log;

    location / {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话接口要等大模型，别 60 秒就掐断
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
